<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YesOS NAS</title>
<link rel="stylesheet" href="/admin/app.css">
</head>
<body>
<header class="topbar">
  <button id="nav-toggle" class="icon-btn" aria-label="Menu">&#9776;</button>
  <div class="brand">
    <span class="brand-mark">Y</span>
    <span class="brand-name" id="hostname">YesOS NAS</span>
  </div>
  <div class="topbar-spacer"></div>
  <span class="badge badge-ok" title="Panel served over HTTPS only (TLS 1.3)">TLS 1.3</span>
  <span class="topbar-user" id="whoami"></span>
  <button id="logout" class="btn btn-ghost">Log out</button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <a href="#/overview" data-page="overview">Overview</a>
    <div class="nav-group">Storage</div>
    <a href="#/disks" data-page="disks">Disks</a>
    <a href="#/files" data-page="files">File system</a>
    <a href="#/shares" data-page="shares">Shared folders</a>
    <a href="#/snapshots" data-page="snapshots">Snapshots</a>
    <div class="nav-group">Access</div>
    <a href="#/users" data-page="users">Users</a>
    <a href="#/devices" data-page="devices">Devices</a>
    <div class="nav-group">System</div>
    <a href="#/network" data-page="network">Network and services</a>
    <a href="#/security" data-page="security">Security</a>
    <a href="#/log" data-page="log">Activity log</a>
  </nav>

  <main class="content">
    <div class="page-head">
      <h1 id="page-title">Overview</h1>
      <span class="page-meta" id="page-meta"></span>
    </div>
    <div id="page"></div>
  </main>
</div>
<script src="/admin/app.js"></script>
</body>
</html>
